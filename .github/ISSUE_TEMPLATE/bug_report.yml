name: Bug report
description: Report a reproducible bug or regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail so we can reproduce and fix it quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A clear and concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Scroll to ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: input
    id: page_url
    attributes:
      label: Affected page URL
      description: If relevant, include the page URL where the issue occurs.
      placeholder: https://jaikhyapaparampara.com/...
  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop
        - Mobile
        - Tablet
        - Not sure
  - type: input
    id: browser
    attributes:
      label: Browser/version
      placeholder: e.g., Chrome 130, Safari 18, Firefox 129
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else helpful.
