name: validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  playwright-validation:
    name: Playwright validation
    # Pin the image: ubuntu-latest started migrating to Ubuntu 26 on 2026-10-19,
    # and Playwright 1.59.1 refuses to install Chromium there -- the run fails with
    # `ERROR: Playwright does not support chromium on ubuntu26.04-x64`. Do not move
    # this back to ubuntu-latest until Playwright is upgraded (a new Chromium build
    # means regenerated visual baselines) — see ROADMAP.md §6.
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fast checks first: they need no browser, so a browser-install failure
      # can no longer hide them.
      - name: Run unit tests
        run: npm run test:unit

      - name: Report runner image
        run: |
          echo "::notice::Runner is $(. /etc/os-release && echo "$PRETTY_NAME")"

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run validation baseline
        run: npm run validate

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  link-check:
    name: Link check
    # Same image as the browser job so both see the same Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site for link checking
        run: npm run build

      - name: Check every generated article
        run: npm run check:archive

      - name: Check README and key entry pages
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --root-dir _site
            README.md
            _site/index.html
            _site/search/index.html
            _site/gallery/index.html
            _site/articles/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
