name: validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  playwright-validation:
    name: Playwright validation
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - name: Run validation baseline
        run: npm run validate

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site for link checking
        run: npm run build

      - name: Check README and key entry pages
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            README.md
            _site/index.html
            _site/search/index.html
            _site/gallery/index.html
            _site/articles/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
