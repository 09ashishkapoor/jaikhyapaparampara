name: Auto-Update Version and Date

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get commit info
        id: commit
        run: |
          GIT_DATE=$(git log -1 --format=%cI)
          echo "git_date=$GIT_DATE" >> $GITHUB_OUTPUT
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Update HTML meta tags
        run: |
          VERSION="1.${{ steps.commit.outputs.commit_count }}"
          DATE="${{ steps.commit.outputs.git_date }}"
          
          # Update build-version meta tag
          sed -i "s/<meta name=\"build-version\" content=\"[^\"]*\">/<meta name=\"build-version\" content=\"${VERSION}\">/" index.html
          
          # Update build-date meta tag
          sed -i "s/<meta name=\"build-date\" content=\"[^\"]*\">/<meta name=\"build-date\" content=\"${DATE}\">/" index.html
          
          echo "Updated to version ${VERSION} with date ${DATE}"

      - name: Update sitemap
        run: |
          if [ -f sitemap.xml ]; then
            TODAY=$(date -I)
            python3 - <<'PY'
import os
from datetime import date
from xml.etree import ElementTree as ET

tree = ET.parse('sitemap.xml')
root = tree.getroot()

# Handle default namespace if present
ns = ''
if root.tag.startswith('{'):
    ns = root.tag.split('}')[0].strip('{')

def qname(tag):
    return f'{{{ns}}}{tag}' if ns else tag

updated = False
for url in root.findall('.//' + qname('url')):
    loc = url.find(qname('loc'))
    if loc is None or loc.text is None:
        continue
    lm = url.find(qname('lastmod'))
    if lm is None:
        lm = ET.SubElement(url, qname('lastmod'))
    lm.text = date.today().isoformat()
    updated = True

if updated:
    tree.write('sitemap.xml', encoding='utf-8', xml_declaration=True)
    print('sitemap.xml updated')
PY
            git add sitemap.xml || true
          fi

      - name: Commit and push if changed
        run: |
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update version and date [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
